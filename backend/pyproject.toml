[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uma-platform-api"
version = "0.1.0"
license = { text = "MIT" }
description = "TSFlow backend for verifiable large-molecule transition-state searches"
requires-python = ">=3.11"
dependencies = [
  "fairchem-core==2.21.0",
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "python-multipart>=0.0.20",
  "uma-workflows[frequencies]",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.scripts]
uma = "app.cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<10.0",
]
mps = [
  "pymatgen>=2025.6,<2027.0",
]
xtb = [
  "xtb>=22.1,<23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]


[tool.uv.sources]
uma-workflows = { path = "../packages/uma-workflows", editable = true }
