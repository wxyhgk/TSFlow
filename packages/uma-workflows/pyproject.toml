[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ts-flow"
version = "0.1.4"
license = { text = "MIT" }
description = "TSFlow transition-state workflows and validation tools"
requires-python = ">=3.11"
dependencies = [
  "ase>=3.23,<4.0",
  "geometric>=1.1,<2.0",
  "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
frequencies = [
  "scipy>=1.13,<2.0",
]
dmf = [
  "cyipopt>=1.6,<2.0",
  "pydmf==1.2.1",
]
sella = [
  "scipy>=1.13,<2.0",
  "sella>=2.5,<3.0",
]
uma = [
  "fairchem-core>=2.21,<3.0",
  "omegaconf>=2.3,<3.0",
]
all = [
  "cyipopt>=1.6,<2.0",
  "fairchem-core>=2.21,<3.0",
  "omegaconf>=2.3,<3.0",
  "pydmf==1.2.1",
  "scipy>=1.13,<2.0",
  "sella>=2.5,<3.0",
]
dev = [
  "cyipopt>=1.6,<2.0",
  "pydmf==1.2.1",
  "pytest>=8.0,<10.0",
  "scipy>=1.13,<2.0",
  "sella>=2.5,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/uma_workflows"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
